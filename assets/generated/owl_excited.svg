    <!-- Belly -->
    <ellipse cx="149" cy="201" rx="57" ry="43" fill="#FFF1D0"/>

    <!-- Ear tufts perked up excited -->
    <path d="M90 58 L96 41 M127 50 L133 34 M170 48 L178 32"
      stroke="#936747" stroke-width="5" stroke-linecap="round"/>

    <!-- Big wide excited eyes -->
    <ellipse cx="114" cy="107" rx="16" ry="18" fill="#59402E"/>
    <ellipse cx="183" cy="107" rx="16" ry="18" fill="#59402E"/>
    <circle cx="110" cy="101" r="5" fill="white"/>
    <circle cx="179" cy="101" r="5" fill="white"/>
    <!-- Sparkle in eyes -->
    <circle cx="121" cy="104" r="2" fill="white"/>
    <circle cx="190" cy="104" r="2" fill="white"/>

    <!-- Rosy excited cheeks -->
    <ellipse cx="90" cy="131" rx="14" ry="8" fill="#EFABA2" opacity=".9"/>
    <ellipse cx="208" cy="131" rx="14" ry="8" fill="#EFABA2" opacity=".9"/>

    <!-- Beak -->
    <path d="M139 122 Q149 114 159 122 L149 137 Z"
      fill="#E7A34F" stroke="#B97D37" stroke-width="3"/>

    <!-- Wide open excited grin -->
    <path d="M120 143 Q149 168 178 143"
