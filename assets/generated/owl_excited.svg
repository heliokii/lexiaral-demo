<svg xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 300 300" fill="none">

    <!-- Shadow -->
    <ellipse cx="150" cy="278" rx="79" ry="10" fill="#A89CD3" opacity=".16"/>

    <!-- Feet (jumping position - lifted) -->
    <path d="M114 265 L106 278 M120 268 L124 279
      M172 265 L164 278 M178 268 L186 277"
