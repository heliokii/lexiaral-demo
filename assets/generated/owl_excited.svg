    <path d="M218 128 Q264 108 278 72 Q262 65 248 92
      Q268 58 250 54 Q234 55 222 86 Q238 52 220 57
      Q200 78 202 126 Z"
      fill="#C89760" stroke="#936747" stroke-width="4"/>

    <!-- Body (shifted slightly up - jumping) -->
    <path d="M76 95 L68 39 L111 59
      Q147 33 190 56 L220 30 L223 93
      Q240 116 233 160
      Q237 243 151 253
      Q67 249 67 167 Q60 125 76 95 Z"
