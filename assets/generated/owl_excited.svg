    <!-- Excited big sparkles all around -->
    <path d="M44 61 L35 47 M54 55 L51 38 M32 71 L20 67"
      stroke="#F5CC65" stroke-width="8" stroke-linecap="round"/>
    <path d="M244 45 L252 30 M258 62 L270 55 M240 68 L253 72"
